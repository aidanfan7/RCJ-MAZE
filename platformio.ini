; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
workspace_dir = ~/.srstuff/.pio

[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
lib_deps =
	adafruit/Adafruit APDS9960 Library@^1.3.1
	adafruit/Adafruit GFX Library@^1.13.0
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit NeoPixel@^1.15.5
	pololu/VL53L0X@^1.3.1
	pololu/PololuQik@^2.1.0
	stm32duino/STM32duino VL53L4CX@^1.1.0
monitor_filters = 
	send_on_enter
	time
monitor_echo = true
monitor_eol = CR
